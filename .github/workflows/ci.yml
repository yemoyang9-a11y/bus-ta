name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**", "fix/**"]
  pull_request:
    # 통합 브랜치(claude/**)를 base 로 하는 팀원 PR 도 검증한다.
    # main 만 걸려 있던 동안 PR #23·#24 가 CI 없이 올라왔다.
    branches: [main, "claude/**"]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 단일 출처로 쓴다.
      # 여기에 version 을 함께 적으면 action 이 "Multiple versions of pnpm specified" 로
      # 셋업 단계에서 실패한다(2026-06-29 이후 CI 가 전부 이 이유로 죽어 있었다).
      - uses: pnpm/action-setup@v4

      # 배포(render.yaml 의 NODE_VERSION)와 같은 22.17.0 을 쓴다.
      # 20 으로 두면 pnpm 11.7.0 이 node:sqlite 를 찾지 못해 죽는다(>= 22.13 요구).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (shared + server + mobile)
        run: pnpm -r typecheck

  supabase-boarding-sql:
    name: Supabase Boarding SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run boarding migration and race regressions
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/test-supabase-boarding.sh
