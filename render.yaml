# Render Blueprint — apps/server(Express) 배포 설정
#
# 사용법: Render 대시보드 → New → Blueprint → 이 저장소 선택.
#         이 파일을 읽어 서비스가 자동 생성된다.
#
# 비밀값은 저장소에 두지 않는다. 아래 `sync: false` 항목은 Render 대시보드의
# Environment 탭에서 직접 입력한다. `.env.example`의 이름과 동일하게 맞춘다.
#
# 주의: 이 파일은 pnpm 워크스페이스 루트 기준이다. apps/server 만 배포하고
#       apps/mobile 은 배포 대상이 아니다(Expo 앱은 EAS 빌드로 나간다).

services:
  - type: web
    name: bus-ta-server
    runtime: node
    plan: free
    region: singapore
    # 백엔드 작업 브랜치. main 으로 병합한 뒤에는 이 값을 main 으로 바꾼다.
    branch: claude/nice-archimedes-iv7iu0

    # corepack 으로 package.json 의 packageManager(pnpm@11.7.0) 버전을 그대로 쓴다.
    # build(tsc)는 타입 오류가 있으면 배포를 막는 컴파일 게이트 역할이다.
    # 실행은 tsx 가 TypeScript 를 직접 읽는다 — @bus-ta/shared 가 컴파일된 JS 가 아니라
    # TS 원본(main: ./src/index.ts)을 노출해서 순수 node 로는 워크스페이스 패키지를
    # 해석하지 못하기 때문이다. shared 에 빌드 단계를 붙이면 node 실행으로 되돌릴 수 있다.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @bus-ta/server build
    startCommand: pnpm --filter @bus-ta/server start

    # dbStatus 가 UP 또는 NOT_CONFIGURED 면 200, 실제 DB 장애일 때만 500 을 반환한다.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      # corepack 이 pnpm 을 내려받을 때 대화형 확인을 띄우지 않게 한다.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"

      # 아래는 모두 Render 대시보드에서 값을 입력한다(저장소에 값 없음).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: ODSAY_API_KEY
        sync: false
      - key: GBIS_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
